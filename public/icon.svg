<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Bidx ProLink</title>
  <desc id="desc">Bidx ProLink blue BK mark with blue and orange swooshes and the complete Bidx ProLink wordmark.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0878ee"/>
      <stop offset="1" stop-color="#092e83"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9b00"/>
      <stop offset="1" stop-color="#f05a24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#fff"/>
  <rect x="13" y="13" width="486" height="486" rx="112" fill="#fff" stroke="url(#blue)" stroke-width="16" filter="url(#shadow)"/>
  <text x="256" y="330" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="238" font-weight="900" font-style="italic" letter-spacing="-19" fill="url(#blue)">BK</text>
  <path d="M75 342 C125 397 238 390 338 337 C390 310 429 273 449 236" fill="none" stroke="#0878ee" stroke-width="15" stroke-linecap="round"/>
  <path d="M178 373 C281 365 383 315 444 237" fill="none" stroke="url(#orange)" stroke-width="12" stroke-linecap="round"/>
  <path d="M332 190 C397 155 454 178 465 228 C472 260 454 293 420 317" fill="none" stroke="#0878ee" stroke-width="13" stroke-linecap="round"/>
  <text x="256" y="429" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="900" font-style="italic" letter-spacing="-2.4" fill="#082f80">Bidx ProLink</text>
  <path d="M119 454 C211 431 331 431 409 446" fill="none" stroke="url(#orange)" stroke-width="8" stroke-linecap="round"/>
</svg>