name: ProLink consolidated build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prolink-consolidated-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ProLink frontend and validate Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out consolidated main source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ProLink AI behaviour tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Validate Cloudflare Worker configuration (dry run)
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Deploy ProLink to Cloudflare production
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Explain skipped Cloudflare deployment
        if: github.event_name != 'pull_request' && (secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '')
        run: echo "Cloudflare production deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bidx-prolink-consolidated-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
