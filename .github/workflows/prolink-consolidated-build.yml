name: ProLink consolidated build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prolink-consolidated-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ProLink frontend and validate Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out consolidated main source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Validate Cloudflare Worker configuration (dry run only)
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bidx-prolink-consolidated-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
