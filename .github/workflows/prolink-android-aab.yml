name: Pedes ProLink Android AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Google Play version code (must be higher than the last uploaded version)"
        required: true
        default: "28"
      version_name:
        description: "Android version name"
        required: true
        default: "6.0"

permissions:
  contents: read

jobs:
  build:
    name: Build signed native Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate ProLink launcher icon
        run: |
          npm install --no-audit --no-fund
          node scripts/generate-pwa-icons.mjs
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          cp public/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp public/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp public/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp public/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install Android SDK packages and accept required licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prolink-signing.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/prolink-signing.keystore" >> "$GITHUB_ENV"

      - name: Normalize and validate Google Web OAuth client ID
        env:
          RAW_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$RAW_GOOGLE_WEB_CLIENT_ID" || (echo "Missing GOOGLE_WEB_CLIENT_ID repository secret" && exit 1)
          GOOGLE_WEB_CLIENT_ID="$(printf '%s' "$RAW_GOOGLE_WEB_CLIENT_ID" | tr -d '\r\n' | sed -E "s/^[[:space:]\"']+//; s/[[:space:]\"']+$//")"
          if ! printf '%s' "$GOOGLE_WEB_CLIENT_ID" | grep -Eq '^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$'; then
            echo "GOOGLE_WEB_CLIENT_ID is not a valid Google Web application OAuth client ID."
            echo "Use the Web application client ID from the same Google Cloud project as the Android OAuth client."
            exit 1
          fi
          echo "::add-mask::$GOOGLE_WEB_CLIENT_ID"
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
          test -n "$GOOGLE_WEB_CLIENT_ID" || (echo "Missing GOOGLE_WEB_CLIENT_ID repository secret" && exit 1)
          ./gradlew --version 2>/dev/null || true
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt of 3"
            if gradle --no-daemon --max-workers=2 -p android :app:bundleRelease -PVERSION_CODE="${{ inputs.version_code || '28' }}" -PVERSION_NAME="${{ inputs.version_name || '6.0' }}" -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Verify AAB output
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: pedes-prolink-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
