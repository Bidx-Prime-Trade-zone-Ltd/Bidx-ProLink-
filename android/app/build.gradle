plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def googleWebClientId = (project.findProperty("GOOGLE_WEB_CLIENT_ID") ?: System.getenv("GOOGLE_WEB_CLIENT_ID") ?: "").toString().trim()
// Credential Manager must receive the Web application OAuth client ID as the
// ID-token audience. Reject Android client IDs, copied quotes, and malformed
// values at build time instead of producing an AAB that fails after account pick.
if (!googleWebClientId.matches(/^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$/)) {
    throw new GradleException("GOOGLE_WEB_CLIENT_ID is missing or invalid. Set the Google Cloud OAuth 2.0 Client ID whose application type is Web application (not Android).")
}

android {
    namespace 'online.bidxpro.prolink'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'online.bidxpro.prolink'
        minSdk 24
        targetSdk 36
        versionCode = (project.findProperty("VERSION_CODE") ?: "29").toString().toInteger()
        versionName = (project.findProperty("VERSION_NAME") ?: "6.1").toString()
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", '"' + googleWebClientId.replace("\\", "\\\\").replace('"', '\\\"') + '"'
    }

    signingConfigs {
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storeType "PKCS12"
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseStoreFile) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'com.google.android.play:app-update:2.1.0'
}
